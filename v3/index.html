
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - V3</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Product Catalog</h1>
        <span class="version">VERSION 3</span>
        <p>Add, view, and search products easily.</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add Product</h2>
            <form id="productForm">
                <label for="productName">Product Name</label>
                <input type="text" id="productName"
                       placeholder="Enter product name" required>

                <label for="productPrice">Price (₹)</label>
                <input type="number" id="productPrice"
                       placeholder="Enter price" min="0.01"
                       step="0.01" required>

                <label for="productCategory">Category</label>
                <input type="text" id="productCategory"
                       placeholder="Enter category" required>

                <button type="submit">Add Product</button>
            </form>
            <p id="statusMessage" role="status"></p>
        </section>

        <section class="card">
            <h2>Search Products</h2>
            <input type="search" id="searchInput"
                   placeholder="Search by product name..."
                   aria-label="Search products by name">
            <p id="searchMessage" role="status"></p>
        </section>

        <section class="card">
            <div class="list-heading">
                <h2>Product List</h2>
                <span id="productCount">0 products</span>
            </div>
            <div id="productList"></div>
            <p id="emptyMessage">No products added yet.</p>
        </section>
    </main>

    <footer>
        <p>Product Catalog | Register Number: 24MIS0205</p>
    </footer>
</body>
</html>
