
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalog-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalog-v1
  template:
    metadata:
      labels:
        app: productcatalog-v1
    spec:
      containers:
        - name: productcatalog
          image: sarathvenkat07/productcatalog:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalog-v1
spec:
  type: NodePort
  selector:
    app: productcatalog-v1
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
